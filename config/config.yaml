# ============================================================
#  AI 需求雷达 · 主配置文件
#  改这一个文件就能换行业、换关键词、换数据源、调作息
# ============================================================

project:
  name: "AI需求雷达"
  data_dir: data
  db_path: data/demand.db
  log_dir: logs

# ------------------------------------------------------------
# 一、监测主题
# ------------------------------------------------------------
topic:
  name: "AI"
  description: "围绕 AI 工具/大模型，挖掘用户真实痛点与未被满足的需求"

  # 发现类关键词：拿去搜索引擎、贴吧、B站做搜索，用于发现新内容
  keywords:
    - "AI工具"
    - "AI助手"
    - "AI写作"
    - "AI绘画"
    - "AI做视频"
    - "AI剪辑"
    - "AI配音"
    - "AI客服"
    - "AI编程"
    - "AI问答"
    - "大模型"
    - "国产大模型"
    - "ChatGPT"
    - "Claude"
    - "AI提示词"
    - "AI数字人"
    - "AI办公"
    - "AI学习"
    - "智能体"
    - "Agent"

  # 【用途已变】仅仅「命中痛点词」的模式已经不作为默认了，见下面的 gates.mode。
  # 这一列现在的作用：给大模型做参考（哪些是显性信号），
  # 以及你在 hints_only 省钱模式下才用它。
  pain_hints:
    - "太难用"
    - "难用"
    - "不好用"
    - "用不了"
    - "用不起"
    - "不会用"
    - "不想用"
    - "求推荐"
    - "求购"
    - "有没有懂"
    - "有谁知道"
    - "希望能"
    - "希望可以"
    - "能不能有个"
    - "想要一个"
    - "要是有"
    - "要是能"
    - "吐槽"
    - "太坑"
    - "是坑"
    - "智商税"
    - "收费太贵"
    - "太贵"
    - "价格贵"
    - "免费吗"
    - "白嫖"
    - "卡顿"
    - "闪退"
    - "卡死"
    - "崩了"
    - "bug"
    - "BUG"
    - "报错"
    - "封号"
    - "限流"
    - "广告太多"
    - "全是广告"
    - "破解"
    - "平替"
    - "替代品"
    - "差不多的"
    - "效果差"
    - "不准"
    - "不智能"
    - "人工智障"
    - "怎么解决"
    - "怎么办"
    - "救救"
    - "无语"
    - "退钱"
    - "退款"

  # topic_relevant 模式下，正文里要出现这些词才算「跟主题相关」
  relevance_keywords:
    - "AI"
    - "ai"
    - "人工智能"
    - "大模型"
    - "模型"
    - "工具"
    - "智能体"
    - "Agent"
    - "GPT"
    - "对话"
    - "生成"
    - "提示词"

  # 广告/引流/水军的黑名单，命中直接丢弃
  exclude:
    - "加微信"
    - "加v信"
    - "加V"
    - "私聊领取"
    - "免费送"
    - "点击链接"
    - "扫码"
    - "群里发"
    - "资源啦"
    - "资源a"

  # ------------------------------------------------------------
  # 【重要】候选闸门 —— 决定哪些评论送进大模型
  #
  # 默认值 all_relevant = **不做痛点词预筛**。
  # 为什么：真正值钱的需求往往藏在最平常的话里，
  #   例："我现在写周报都先AI生成一遍再自己改，改的时间跟重写差不多"
  #   这句话里没有任何"难用/太贵/求推荐"，但它暴露的需求比一百句吐槽都值钱。
  # 先用痛点词筛一遍，等于把最有价值的那部分提前扔掉了。
  #
  # 三种模式：
  #   all_relevant    采集本来就是按主题关键词搜的，全部送审 ← 推荐
  #   topic_relevant  额外要求正文命中 relevance_keywords 才送
  #   hints_only      只送命中 pain_hints 的（最省钱，但漏掉隐性需求，不推荐）
  # ------------------------------------------------------------
gates:
  mode: all_relevant
  min_chars: 8          # 短于这个长度的顺口话没信息量
  max_chars: 800        # 长文截断前交给模型
  min_unique_chars: 4   # 去重后字符种类少于此数视为灌水（"哈哈哈""6666"）
  skip_if_no_hanzi: true # 纯英文/符号跳过


# ------------------------------------------------------------
# 二、大模型（需求抽取 + 需求归并）
# ------------------------------------------------------------
llm:
  enabled: true
  provider: openai-compatible
  # 真实地址与密钥写在 config/secrets.yaml（优先级更高）。
  # 这里放占位值，防止你漏建 secrets.yaml 时误打到 DeepSeek 官方。
  base_url: "https://www.bb-api.com/v1"
  api_key_env: OPENAI_API_KEY   # 优先从这里读环境变量
  api_key: ""                   # 也可以直接填（不建议，会随 config 一起被分享出去）
  model: "deepseek-v4.1-flash"
  temperature: 0.0
  timeout: 180        # 第三方网关慢，归并批大时要放宽
  batch_size: 8        # 一次喂几条。系统提示词较长，批越大摊得越薄
  max_workers: 4       # 并发请求数
  max_calls_per_round: 80   # 单轮最多调多少次大模型，控制成本
  fallback_to_rules: true   # 没有 key 或调用失败时，降级到规则抽取器
  # 成本：因为改成「全量送审」，用量比只筛痛点词贵约 3 倍。
  # 一轮 200 条评论 ≈ 输入 15 万 tokens / 输出 20 万 tokens ≈ ¥2 上下（DeepSeek 标准价）。
  # 一天跑 12 轮 ≈ ¥25/天。想省钱就把 schedule.rounds_per_day 调小，
  # 或者把 gates.mode 改成 hints_only（代价是丢掉隐性需求）。

# ------------------------------------------------------------
# 三、数据源
# ------------------------------------------------------------
sources:
  tieba:
    enabled: true
    threads_per_keyword: 15
    replies_per_thread: 30

  bilibili:
    enabled: true
    videos_per_keyword: 8
    comments_per_video: 40

  search_engine:
    enabled: true
    # 百度 Web 端有高强度风控验证，默认不用；要用的话加上会自己撞墙
    engines: [bing]
    results_per_query: 20
    pages: 1
    fetch_discovered: true     # 发现到的 URL 再由通用抓取器去取正文

  generic_page:
    enabled: true
    urls_file: config/watch_urls.txt
    watch_urls: []

  browser_import:
    enabled: true
    inbox_dir: data/inbox      # 浏览器通道把 json/csv 丢进这里，自动入库

# ------------------------------------------------------------
# 四、网络与合规（重要，别乱改）
# ------------------------------------------------------------
network:
  timeout: 20

compliance:
  respect_robots: true
  # 同一域名两次请求之间的随机间隔（秒）——模拟人浏览，绝不做高频轰炸
  delay_min_sec: 3
  delay_max_sec: 8
  # 单域名每小时请求上限，超过就跳过本轮该域名
  max_requests_per_domain_per_hour: 150
  redact_pii: true          # 手机号/邮箱/身份证/微信号 落库前打码
  store_author_raw: false   # 不存原始昵称，只存哈希

  # ------------------------------------------------------------------
  # robots.txt 豁免名单 —— 唯一一处需要你自己做决定的地方
  #   api.bilibili.com 的 robots.txt 明写着「User-agent: * / Disallow: /」。
  #   也就是说 B 站官方明确不允许程序化抓取它的接口。
  #   目前默认放行，方便你先把系统跑起来。
  #   若你不接受这个风险：把下面这一行删成空列表 robots_overrides: []
  #       -> B 站采集立即停用，其余功能不受任何影响。
  #   白名单之外系统依旧：低频（每域名 3~8 秒一次请求）、只读、
  #   只取公开可见内容、绝不破解登录或验证码、绝不针对个人做画像。
  # ------------------------------------------------------------------
  robots_overrides:
    - api.bilibili.com

  # 不想让它抓的域名（后缀匹配，写 example.com 会连 sub.example.com 一起挡）。
  # 建议用法：全网搜索会混进来一些仿冒站、垃圾站，拦到一次就往这里加一次。
  domain_blocklist:
    # 2026-09-25 抓取时被本机安全系统判定为「黑灰产/仿冒网站」并拦截。
    # 这里主动排除掉，让采集器以后不再去碰它（不会重试、不会换方式访问）。
    - app-yuanbao.cn

  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
  note: "只采集公开可见内容；不破解登录、不绕过验证码、不做用户画像，仅输出聚合统计。"

# ------------------------------------------------------------
# 五、7x24 不定时调度
# ------------------------------------------------------------
schedule:
  rounds_per_day: 12          # 一天跑多少轮（配合全量送审后的成本，12 轮性价比较好）
  jitter_ratio: 0.45          # 每轮间隔抖动 ±45%，让节奏不规律
  min_gap_minutes: 12         # 两轮最小间隔
  quiet_hours: [[2, 6]]       # 深夜降频（只跑一轮轻量巡查）
  per_round_max_items: 300    # 单轮最多处理多少条新评论
  per_round_max_keywords: 4   # 单轮随机抽几个关键词轮播（避免每轮全量）

# ------------------------------------------------------------
# 六、看板
# ------------------------------------------------------------
dashboard:
  host: 127.0.0.1
  port: 8777
  auto_refresh_sec: 60
